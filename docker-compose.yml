version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: csw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-csw_inventory}
      POSTGRES_USER: ${DB_USER:-csw_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-csw_app} -d ${DB_NAME:-csw_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csw_backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${DB_NAME:-csw_inventory};Username=${DB_USER:-csw_app};Password=${DB_PASSWORD:-changeme}"
      Jwt__SecretKey: ${JWT_SECRET:-dev-secret-key-change-in-production-must-be-32-chars-minimum!!}
      Jwt__Issuer: csw-inventory
      Jwt__Audience: csw-inventory
      Jwt__ExpiryHours: "8"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csw_frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: csw_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - external

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
